<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 3rem 4rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            font-size: 1.2rem;
        }

        .emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .buttons {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
            justify-content: center;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-blanco {
            background: #fff;
            color: #333;
            border: 2px solid #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-blanco:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-negro {
            background: #1a1a1a;
            color: #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .btn-negro:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">💰</div>
        <h1>¡Hola Mundo!</h1>
        <p>Bienvenido a Finanzas</p>
        <div class="buttons">
            <a href="luz.html" class="btn btn-blanco">Blanco</a>
            <a href="oscuridad.html" class="btn btn-negro">Negro</a>
        </div>
    </div>
</body>
</html>
